name: Daily Collection

on:
  schedule:
    # Runs at 6 AM UTC every day (10 PM PST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write

# Failure policy
#   Primary sources and anything that writes the published file fail HARD:
#   a broken run must not publish. Secondary enrichment uses
#   continue-on-error, which marks the step failed in the Actions UI but
#   lets the run finish. The old `|| echo "...continuing"` was worse than
#   either: the step went green and the failure was invisible.

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyGithub huggingface_hub

      - name: Record the current tool count
        id: before
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, pathlib
          p = pathlib.Path("data/repos.json")
          n = len(json.loads(p.read_text(encoding="utf-8"))) if p.exists() else 0
          print(f"count={n}")
          EOF

      # Primary source. If this fails the run is over.
      - name: Run GitHub collector
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python scripts/collectors/github_collector.py

      # Enrichment only. Visible if it breaks, but not fatal.
      - name: Run HF collector
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/collectors/hf_collector.py

      - name: Categorize repos
        run: python scripts/categorize_repos.py

      # Derived metric. Trending can be missing for a day without harm.
      - name: Calculate trending velocity
        continue-on-error: true
        run: python scripts/analysis/calculate_velocity.py

      # The gate. validate_schema.py exits non-zero on bad data, so a
      # malformed file stops here and yesterday's good data stays live.
      - name: Validate data
        run: python scripts/validation/validate_schema.py data/repos.json

      # Schema-valid but truncated data is the failure the old `|| echo`
      # was hiding: a partial collection still parses. Catch the cliff.
      - name: Check the tool count did not collapse
        env:
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          python - <<'EOF'
          import json, os, pathlib, sys
          before = int(os.environ["BEFORE"])
          after = len(json.loads(pathlib.Path("data/repos.json").read_text(encoding="utf-8")))
          print(f"tools before: {before}   after: {after}")
          if before and after < before * 0.8:
              sys.exit(f"FAIL: tool count fell from {before} to {after} (>20%). "
                       "Refusing to publish a truncated collection.")
          EOF

      - name: Run embed script
        run: python scripts/embed_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily data update"
            git push
          fi
